# 자동 생성: node tools/gen_mechanism_test.js — V4 기구 절차(장착·지지 전환·막대·결합 실패·배출)를 실제 모드로 검사
name: V4 기구 절차 — LOAD 장착, F R U R (지지 전환·막대·개별 후퇴 끝), 결합 실패 중단, 배출
version: 1
author: physical_computing_project
steps:
  - wait-serial: "READY"
  - set-control:
      part-id: retF
      control: pressed
      value: 1
  - set-control:
      part-id: retB
      control: pressed
      value: 1
  - set-control:
      part-id: retR
      control: pressed
      value: 1
  - set-control:
      part-id: retL
      control: pressed
      value: 1
