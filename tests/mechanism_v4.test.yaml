  - set-control:
      part-id: sensF
      control: pressed
      value: 1
  - set-control:
      part-id: retB
      control: pressed
      value: 0
  - set-control:
      part-id: sensB
      control: pressed
      value: 1
  - wait-serial: "LOADED orient=1"
  - set-control:
      part-id: btnStart
      control: pressed
      value: 0
  - write-serial: "F\n"
  - wait-serial: "ERR flip disabled: core not coupled"
  - write-serial: "M D\n"
  - wait-serial: "ERR fixed face D"
  - write-serial: "M F R U R\n"
  - wait-serial: "RETRACT D"
  - set-control:
      part-id: sensD
      control: pressed
      value: 0
  - set-control:
      part-id: retD
      control: pressed
      value: 1
  - wait-serial: "ENGAGE RL"
  - set-control:
      part-id: retR
      control: pressed
      value: 0
  - set-control:
      part-id: sensR
      control: pressed
      value: 1
  - set-control:
      part-id: retL
      control: pressed
      value: 0
  - set-control:
      part-id: sensL
      control: pressed
      value: 1
  - wait-serial: "RETRACT FB"
  - set-control:
      part-id: sensF
      control: pressed
      value: 0
  - set-control:
      part-id: retF
      control: pressed
      value: 1
  - set-control:
      part-id: sensB
      control: pressed
      value: 0
  - set-control:
      part-id: retB
      control: pressed
      value: 1
  - wait-serial: "ENGAGE D"
  - set-control:
      part-id: retD
      control: pressed
      value: 0
  - set-control:
      part-id: sensD
      control: pressed
      value: 1
  - wait-serial: "RETRACT D"
  - set-control:
      part-id: sensD
      control: pressed
      value: 0
  - set-control:
      part-id: retD
      control: pressed
      value: 1
  - wait-serial: "MOVED 4 flips=0 regrips=2"
  - write-serial: "P\n"
  - wait-serial: "STATE LUULUDFFDRRLRRBRRBUUBFFBFFBRRUDDUDDLFFRLLDLLDFLDUBBUBB"
  - wait-serial: "MECH fb=0 rl=1 d=0 lock=1 orient=1 loaded=1"
  - write-serial: "T 1500\n"
  - wait-serial: "TIMEOUT 1500"
  - write-serial: "M F\n"
  - wait-serial: "ENGAGE FB"
  - wait-serial: "ERR ENGAGE FB timeout"
  - wait-serial: "ABORTED completed=0"
  - write-serial: "P\n"
  - wait-serial: "STATE LUULUDFFDRRLRRBRRBUUBFFBFFBRRUDDUDDLFFRLLDLLDFLDUBBUBB"
