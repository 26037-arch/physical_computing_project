  - set-control:
      part-id: sensR
      control: pressed
      value: 0
  - set-control:
      part-id: retR
      control: pressed
      value: 1
  - set-control:
      part-id: sensL
      control: pressed
      value: 0
  - set-control:
      part-id: retL
      control: pressed
      value: 1
  - wait-serial: "EJECTED"
