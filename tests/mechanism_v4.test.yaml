      part-id: retD
      control: pressed
      value: 1
  - set-control:
      part-id: retLock
      control: pressed
      value: 1
  - write-serial: "T 0\n"
  - wait-serial: "TIMEOUT 0"
  - set-control:
      part-id: btnStart
      control: pressed
      value: 1
  - wait-serial: "ENGAGE D"
  - set-control:
      part-id: retD
      control: pressed
      value: 0
  - set-control:
      part-id: sensD
      control: pressed
      value: 1
  - wait-serial: "READY TO LOAD"
  - set-control:
      part-id: btnStart
      control: pressed
      value: 0
