# 자동 생성: node tools/gen_mechanism_test.js — V5 기구 절차(장착·재배향 스핀/뒤집기·층 회전·시연 명령·배출)를 실제 모드로 검사
name: V5 기구 절차 — LOAD 장착, U D' F R2 L B (후드·스핀·뒤집기·층 회전), Y/F 시연, 배출
version: 1
author: physical_computing_project
