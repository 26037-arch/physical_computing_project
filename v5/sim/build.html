<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>V5 큐브 로봇 3D 제작 설명서</title><link rel="icon" href="data:,">
<style>
:root{--bg:#f6f8fa;--panel:#ffffff;--line:#d5dde3;--ink:#1c2730;--muted:#5a6872;--accent:#0f8f72;--accent-ink:#ffffff;--warn-bg:#fff4e5;--warn-line:#e08a00;--ok-bg:#eaf7f1;--stage:#e6ecf0;--chip:#eef2f5;--label:#ffffffee}
@media (prefers-color-scheme:dark){:root{--bg:#10171c;--panel:#192329;--line:#314148;--ink:#e6efed;--muted:#a0b5b7;--accent:#83dfbe;--accent-ink:#102b24;--warn-bg:#3a2c14;--warn-line:#f4be69;--ok-bg:#173229;--stage:#142028;--chip:#22313a;--label:#192329ee}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,'Malgun Gothic','Apple SD Gothic Neo',sans-serif}
button{font:inherit;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:7px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:19px;margin:0;letter-spacing:-.02em}
header p{margin:0;color:var(--muted);font-size:12.5px}
header nav{display:flex;gap:14px;font-size:13px;flex-wrap:wrap}
main{display:grid;grid-template-columns:minmax(0,1fr) 420px;height:calc(100vh - 62px);min-height:560px}
main>*{min-width:0}
.stage{position:relative;background:var(--stage);overflow:hidden;min-height:420px}
#view{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#view:active{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;transform:translate(-50%,-140%);background:var(--label);border:1px solid var(--line);border-radius:5px;padding:1px 7px;font-size:12px;white-space:nowrap;color:var(--ink)}
.tag.new{border-color:var(--accent);font-weight:700}
.stage-top{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;gap:10px;pointer-events:none;font-size:12.5px;color:var(--muted)}
.stage-top b{color:var(--ink)}
.tools{position:absolute;left:14px;right:14px;bottom:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools button{font-size:13px;padding:6px 10px}
.tools label{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:4px}
.tools input[type=range]{width:min(220px,30vw);accent-color:var(--accent)}
.tools input[type=checkbox]{accent-color:var(--accent)}
.error{position:absolute;left:20px;right:20px;top:60px;background:#5a2222;color:#ffd9cc;padding:14px;border-radius:8px;white-space:pre-wrap}
.error[hidden]{display:none}
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#stepNav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--line);flex:none}
#stepNav button{flex:none;font-size:12.5px;padding:5px 9px;border-radius:20px;white-space:nowrap}
#stepNav button[aria-current=step]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
#content{padding:16px 18px;overflow:auto;flex:1;min-height:0}
#content h2{font-size:19px;margin:0 0 4px;letter-spacing:-.02em}
#content .lead{color:var(--muted);margin:0 0 12px;font-size:14px}
#content h3{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:16px 0 6px;text-transform:uppercase}
#content ol,#content ul{margin:0;padding-left:20px}
#content li{margin:4px 0}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px}
td:last-child,th:last-child{text-align:right;white-space:nowrap}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid #0003}
.warn,.ok{border-left:4px solid var(--warn-line);background:var(--warn-bg);padding:8px 12px;margin:12px 0 0;border-radius:0 6px 6px 0;font-size:13.5px}
.ok{border-left-color:var(--accent);background:var(--ok-bg)}
.demo{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
code{font-family:Consolas,'D2Coding',ui-monospace,monospace;background:var(--chip);padding:1px 5px;border-radius:4px;font-size:13px}
footer{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);flex:none;align-items:center}
footer .grow{flex:1;text-align:center;color:var(--muted);font-size:12.5px}
@media (max-width:900px){main{grid-template-columns:minmax(0,1fr);height:auto}.stage-top span:first-child{display:none}.stage{height:58vh}aside{border-left:0;border-top:1px solid var(--line)}#content{overflow:visible}}
</style>
</head>
<body>
<header>
  <div><h1>V5 큐브 로봇 3D 제작 설명서</h1><p>기울어진 컵 · ㄷ자 후드 · 리프터 — 출력 7종, 구동기 3개. 화면을 끌어 돌려 보고, 단계 버튼으로 조립 순서를 따라간다.</p></div>
  <nav><a href="../../docs/WIRING_V5_R4.html">배선 안내</a><a href="index.html">동작 시뮬레이터</a><a href="../../docs/BUILD_V5.md">제작 설명서(글)</a></nav>
</header>
<main>
  <div class="stage" id="stage">
    <canvas id="view" aria-label="V5 큐브 로봇 조립 3D 화면"></canvas>
    <div id="labels" aria-hidden="true"></div>
    <div class="stage-top"><span>끌기: 회전 · 휠: 확대 · Shift+끌기: 이동</span><span id="modelInfo"></span></div>
    <div class="tools">
      <button id="btnReplay" class="primary">▶ 다시 보기</button>
      <label>진행 <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="조립 진행"></label>
      <label><input id="chkGhost" type="checkbox">베이스 투명</label>
      <label><input id="chkLabels" type="checkbox" checked>이름표</label>
      <button id="btnView">시점 되돌리기</button>
    </div>
    <div class="error" id="error" role="alert" hidden></div>
  </div>
  <aside>
    <div id="stepNav" role="tablist" aria-label="조립 단계"></div>
    <div id="content" aria-live="polite"></div>
    <footer><button id="btnPrev">← 이전</button><span class="grow" id="stepCount"></span><button id="btnNext" class="primary">다음 →</button></footer>
  </aside>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="models.js" onerror="window.CubeModels={params:{},parts:{}}"></script>
<script src="build.js"></script>
</body>
</html>
